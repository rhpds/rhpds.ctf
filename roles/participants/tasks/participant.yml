---
- name: Become block
  become: true
  block:
    - ansible.builtin.user:
        name: "{{ rhpds_ctf_participants_ar_username }}"
        group: "{{ rhpds_ctf_participants_ar_group }}"
        password: "{{ rhpds_ctf_participants_ar_user_password | password_hash('sha512') | default(omit) }}"
      delegate_to: "{{ _hostname_ }}"

    - when: rhpds_ctf_participants_ar_user_password is defined
      block:
        - name: Enable password ssh authentication
          ansible.builtin.lineinfile:
            line: PasswordAuthentication yes
            regexp: '^ *PasswordAuthentication'
            path: /etc/ssh/sshd_config
          delegate_to: "{{ _hostname_ }}"

        - name: Restart sshd to read conf changes
          ansible.builtin.service:
            name: sshd
            state: restarted
          delegate_to: "{{ _hostname_ }}"

    - name: Enable sudo access for the user
      ansible.builtin.lineinfile:
        dest: /etc/sudoers.d/90-{{ rhpds_ctf_participants_ar_username }}
        state: present
        create: true
        line: '{{ rhpds_ctf_participants_ar_username }} ALL=(ALL) NOPASSWD: ALL'
      delegate_to: "{{ _hostname_ }}"

    - name: Create .ssh directory
      ansible.builtin.file: 
        path: /home/{{ rhpds_ctf_participants_ar_username }}/.ssh/
        state: directory
        owner: "{{ rhpds_ctf_participants_ar_username }}"
        group: "{{ rhpds_ctf_participants_ar_group }}"
        mode: 0700
      delegate_to: "{{ _hostname_ }}"

    - name: Create public key
      ansible.builtin.copy:
        content: "{{ rhpds_ctf_participants_ar_ssh_public_key }}"
        dest: /home/{{ rhpds_ctf_participants_ar_username }}/.ssh/rhpds_ctf_participants_ar_ssh_public_key.pub
        owner: "{{ rhpds_ctf_participants_ar_username }}"
        group: "{{ rhpds_ctf_participants_ar_group }}"
        mode: 0600
      delegate_to: "{{ _hostname_ }}"

    - name: Copy public key in .ssh/authorized_keys
      ansible.builtin.lineinfile:
        path: /home/{{ rhpds_ctf_participants_ar_username }}/.ssh/authorized_keys
        line: "{{ rhpds_ctf_participants_ar_ssh_public_key }}"
        create: true
        state: present
        owner: "{{ rhpds_ctf_participants_ar_username }}"
        group: "{{ rhpds_ctf_participants_ar_group }}"
        mode: 0600
      delegate_to: "{{ _hostname_ }}"

    - name: Create private key
      ansible.builtin.copy:
        content: "{{ rhpds_ctf_participants_ar_ssh_private_key }}"
        dest: /home/{{ rhpds_ctf_participants_ar_username }}/.ssh/rhpds_ctf_participants_ar_ssh_private_key
        owner: "{{ rhpds_ctf_participants_ar_username }}"
        group: "{{ rhpds_ctf_participants_ar_group }}"
        mode: 0600

    - name: Change IdentityFile being used in ssh config
      ansible.builtin.lineinfile:
        path: /home/{{ rhpds_ctf_participants_ar_username }}/.ssh/config
        regexp: '^(.*IdentityFile.*)$'
        line: "IdentityFile /home/{{ rhpds_ctf_participants_ar_username }}/.ssh/rhpds_ctf_participants_ar_ssh_private_key"

